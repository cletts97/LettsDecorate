 > span { display: block; margin-top: 2px; font-size: 6px; letter-spacing: .1em; font-weight: 400; }\n.swatch-label .icon { width: 17px; height: 17px; }\n.swatch-back { width: 55%; height: 326px; top: 145px; left: 10%; transform: rotate(-13deg); }\n.swatch-back-colour { width: 100%; height: 262px; background: var(--swatch-secondary); transition: background .45s; }\n.swatch-back > span { display: block; font-size: 7px; letter-spacing: .16em; padding: 12px 4px; }\n.palette-caption { position: absolute; bottom: 20px; left: 27px; right: 26px; display: flex; align-items: center; gap: 8px; font-size: 9px; }\n.palette-caption strong { font-weight: 600; }\n.palette-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--swatch); transition: background .45s; }\n.palette-caption-number { margin-left: auto; color: #6c7469; font-size: 8px; letter-spacing: .1em; }\n.palette-controls { display: flex; align-items: center; justify-content: space-between; margin-top: 17px; gap: 16px; font-size: 10px; color: var(--muted); }\n.swatch-buttons { display: flex; gap: 4px; }\n.palette-button { display: grid; place-items: center; width: 35px; height: 35px; background: none; border: 1px solid transparent; border-radius: 50%; padding: 4px; }\n.palette-button span { width: 23px; height: 23px; border-radius: 50%; background: var(--swatch); }\n.palette-button[aria-pressed=true] { border-color: var(--ink); }\n.palette-sage { --swatch: #506555; }\n.palette-clay { --swatch: #98503c; }\n.palette-sand { --swatch: #8c7450; }\n\n/* Intro, services and work */\n.trust-strip { background: var(--dark); color: var(--paper); padding-block: 28px; }\n.trust-inner { display: grid; grid-template-columns: 1.05fr 1fr 1.05fr 1fr; align-items: center; gap: 27px; }\n.trust-inner > p { font-family: var(--serif); font-size: 21px; line-height: 1.3; letter-spacing: -.025em; margin: 0; }\n.trust-inner > span { display: flex; align-items: center; justify-content: center; border-left: 1px solid #ffffff26; padd te-mark\">\u201c\u003c/span>\u003cblockquote>\u003cp>He's tidy, neat and never disappoints, the finish of his work is immaculate.\u003c/p>\u003cfooter>Kerstin \u003cspan>/ Pluckley\u003c/span>\u003c/footer>\u003c/blockquote>\u003ca class=\"text-link light-link\" href=\"testimonials/index.html\">More kind words \u003csvg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"24\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003c/div>\u003c/section>\n\u003csection class=\"cta-section\">\u003cdiv class=\"container cta-inner\">\u003cdiv>\u003cspan class=\"eyebrow\">LET'S MAKE A START\u003c/span>\u003ch2>Ready for a \u003cem>refresh?\u003c/em>\u003c/h2>\u003cp>A room, a front door or a whole-home rethink. Tell us what you have in mind.\u003c/p>\u003c/div>\u003ca class=\"button\" href=\"contact/index.html\">Let's talk about your project \u003csvg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"24\">\u003cpath d=\"M6 18 18 6M6 6h12v12\">\u003c/path>\u003c/svg>\u003c/a>\u003c/div>\u003c/section>\n\u003c/main>\u003cfooter class=\"site-footer\">\u003cdiv class=\"container footer-grid\">\n\u003cdiv class=\"footer-brand\">\u003cimg alt=\"Letts Decorate - Professional Decorating Service\" height=\"266\" loading=\"eager\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAAEKCAYAAACoiGheAAAABGdBTUEAALGPC/xhBQAAAAFzUkdCAK7OHOkAAAAgY0hSTQAAeiYAAICEAAD6AAAAgOgAAHUwAADqYAAAOpgAABdwnLpRPAAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAAuIwAALiMBeKU/dgAAN4NJREFUeNrtnXeYXVX1/j/7Ts2kdyYBQggJgVBCC6CASAm9CEi1IP4QEZAiRRCRKgKCSJUi8qWIAgIiilQpIhCKELqEUJKQhPQ+yZT1+2O/xzm53jsz905Nst7nmSeTueecu8/aa797rbXXXjvgcLQC7/QeWlKfsf1qM3ZDfYaHgdPHzZq+2CXjaA9kXASOVpBVpj5jO9dm7Mr6DNXAN4BzJwys7u7ScThhOboWWQXbuS7D9fU cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003cp id=\"lightbox-caption\">\u003c/p>\u003c/dialog>\u003cscript>/*\n * Add your project photographs here, or use tools/gallery-helper.html.\n * Paths are relative to the site/ folder. Keep filenames lower-case, without spaces.\n * Allowed categories: \"interior\", \"exterior\", \"detail\".\n * Example (remove the surrounding comment and place the object inside the array):\n * {\n *   \"src\": \"assets/images/gallery/living-room.webp\",\n *   \"title\": \"Living room refresh\",\n *   \"alt\": \"Describe what is actually visible in this photograph\",\n *   \"category\": \"interior\",\n *   \"width\": 1600,\n *   \"height\": 1067\n * }\n * Do not add a customer's name or address without their permission.\n */\nwindow.LETTS_GALLERY = [];\n\u003c/script>\u003cscript>/* Plain JavaScript. No third-party scripts, cookies, tracking or network APIs. */\n(() => {\n  'use strict';\n  document.documentElement.classList.add('js');\n  const $ = (selector, root = document) => root.querySelector(selector);\n  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];\n  const menu = $('#main-nav');\n  const menuButton = $('.menu-toggle');\n  const closeMenu = () => {\n    if (!menu || !menuButton) return;\n    menu.classList.remove('is-open');\n    menuButton.setAttribute('aria-expanded', 'false');\n  };\n  menuButton?.addEventListener('click', () => {\n    const open = menuButton.getAttribute('aria-expanded') !== 'true';\n    menuButton.setAttribute('aria-expanded', String(open));\n    menu.classList.toggle('is-open', open);\n  });\n  menu?.addEventListener('click', (event) => {\n    if (event.target.closest('a')) closeMenu();\n  });\n  document.addEventListener('click', (event) => {\n    if (!event.target.closest('.site-header')) closeMenu();\n  });\n  document.addEventListener('keydown', (event) => {\n    if (event.key === 'Escape' && menuButton?.getAttribute('aria-expanded' th) && !path.includes('..');\n  const photos = source.filter(item => item && validPath(item.src) &&\n    typeof item.title === 'string' && item.title.trim() &&\n    typeof item.alt === 'string' && item.alt.trim() && categoryNames[item.category]);\n  const hasPhotos = photos.length > 0;\n  const status = $('[data-gallery-status]');\n  const count = $('[data-gallery-count]');\n  const notice = $('[data-empty-notice]');\n  const originalPlaceholders = [...gallery.children];\n  let activeCategory = 'all';\n  let visiblePhotos = [];\n  let currentIndex = 0;\n  let lastTrigger = null;\n  const modal = $('.lightbox');\n  const modalImage = $('.lightbox-image', modal);\n  const modalCaption = $('#lightbox-caption', modal);\n  const modalCount = $('.lightbox-count', modal);\n  const previous = $('.lightbox-prev', modal);\n  const next = $('.lightbox-next', modal);\n  const close = $('.lightbox-close', modal);\n  if (hasPhotos) {\n    if (notice) notice.hidden = true;\n    $$('[data-gallery-intro]').forEach(el => {\n      el.textContent = 'A selection of interiors, exteriors and finishing touches. Take a closer look at our work.';\n    });\n  }\n  function updateModal(index) {\n    if (!visiblePhotos.length) return;\n    currentIndex = (index + visiblePhotos.length) % visiblePhotos.length;\n    const item = visiblePhotos[currentIndex];\n    modalImage.src = root + item.src;\n    modalImage.alt = item.alt;\n    modalCaption.textContent = item.title;\n    modalCount.textContent = `${currentIndex + 1} / ${visiblePhotos.length}`;\n    previous.disabled = next.disabled = visiblePhotos.length \u003c 2;\n  }\n  function openPhoto(index, trigger) {\n    if (!modal?.showModal) {\n      // Older browsers still get access to the photograph, without relying on popups.\n      window.location.href = root + visiblePhotos[index].src;\n      return;\n    }\n    lastTrigger = trigger;\n    updateModal(index);\n    modal.showModal();\n    document.body.classList.add('modal-open');\n    close.fo fexNrbvIW3YGBxzsFiOFgMB4vhYDEcLIaDxXCwGA4Ww8FiOFgshoPFcLAYDhbDwWI4WAwHi+FgxV3/D4oKxl13FlKVAAAAAElFTkSuQmCC\" rel=\"apple-touch-icon\"/>\u003cstyle>/* Letts Decorate -- a warm, editorial, dependency-free static site.\n   Change the core colour palette here. No external fonts or stylesheets are loaded. */\n:root {\n  --paper: #f8f6f0;\n  --white: #fffefa;\n  --ink: #263a32;\n  --muted: #646a62;\n  --clay: #ab4430;\n  --clay-dark: #8c3525;\n  --sage: #506555;\n  --sand: #d2bea0;\n  --line: #d9dacf;\n  --soft: #efede5;\n  --dark: #24352f;\n  --serif: Georgia, 'Times New Roman', serif;\n  --sans: 'Segoe UI', Arial, Helvetica, sans-serif;\n}\n*, *::before, *::after { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; scroll-padding-top: 112px; }\nbody { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }\nbody.modal-open { overflow: hidden; }\na { color: inherit; text-decoration: none; }\nbutton, input, select { font: inherit; }\nbutton { color: inherit; }\nbutton, a { -webkit-tap-highlight-color: transparent; }\nbutton { cursor: pointer; }\nbutton:disabled { cursor: default; opacity: .4; }\nimg { display: block; max-width: 100%; height: auto; }\nsvg { flex-shrink: 0; }\nfigure, blockquote { margin: 0; }\nh1, h2, h3, h4, p { margin-top: 0; }\nh1, h2 { font-family: var(--serif); font-weight: 400; letter-spacing: -.048em; }\nh1 { margin-bottom: 28px; font-size: clamp(52px, 6.3vw, 92px); line-height: 1.035; }\nh2 { margin-bottom: 25px; font-size: clamp(36px, 4.1vw, 58px); line-height: 1.12; }\nh3 { font-weight: 500; letter-spacing: -.028em; line-height: 1.28; }\nem { font-weight: 400; }\nh1 em, h2 em { color: var(--clay); }\np { margin-bottom: 20px; }\n::selection { background: #dcc7b0; color: #17291e; }\n:focus-visible { outline: 3px solid var(--clay); outline-offset: 5px; }\n[hidden] { display: none !important; }\n.container { width: min(1280px, calc(100% - 112px)); margin-inline: auto; }\n.section { padding-block: 108px; }\n.eyebrow { display: block; font-family: var(--sans); font-size: 10px; font-weight: 650; line-height: 1.6; letter-spacing: .17em; margin-bottom: 23px; }\n.icon { width: 21px; height: 21px; }\n.button { display: inline-flex; min-height: 54px; align-items: center; justify-content: center; gap: 24px; padding: 15px 23px; background: var(--clay); color: var(--white); border: 1px solid var(--clay); border-radius: 2px; font-size: 13px; font-weight: 600; line-height: 1.45; transition: background .2s, transform .2s; }\n.button:hover { background: var(--clay-dark); border-color: var(--clay-dark); transform: translateY(-2px); }\n.button:active { transform: translateY(0); }\n.button-small { min-height: 45px; padding: 12px 19px; font-size: 12px; gap: 22px; }\n.button-small .icon { width: 17px; height: 17px; }\n.text-link { width: fit-content; display: inline-flex; align-items: center; gap: 19px; padding-block: 7px; border-bottom: 1px solid currentColor; font-size: 13px; font-weight: 600; line-height: 1.5; }\n.text-link .icon, .service-link .icon { transition: transform .2s; width: 18px; height: 18px; }\n.text-link:hover .icon, .service-card:hover .icon:last-child { transform: translateX(4px); }\n.skip-link { position: fixed; top: 12px; left: 12px; transform: translateY(-180%); z-index: 500; background: var(--white); padding: 12px 20px; box-shadow: 0 4px 20px #0002; }\n.skip-link:focus { transform: none; }\n.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }\n\n/* Navigation */\n.site-header { position: sticky; top: 0; z-index: 50; background: rgba(248,246,240,.97); border-bottom: 1px solid var(--line); }\n.header-inner { min-height: 98px; display: flex; align-items: center; justify-content: space-between; gap: 30px; }\n.brand { display: inline-flex; align-items: center; gap: 13px; flex-shrink: 0; }\n.brand-icon { display: grid; place-items: center; width: 40px; height: 53px; border-radius: 2px; background: var(--dark); }\n.brand-icon img { width: 28px; height: 43px; object-fit: contain; }\n.brand-name { font-family: var(--serif); font-size: 26px; line-height: 1.18; letter-spacing: -.04em; }\n.brand-name > span { display: block; font-family: var(--sans); font-size: 8px; letter-spacing: .18em; font-weight: 600; margin-top: 5px; }\n.main-nav { display: flex; align-items: center; gap: 29px; }\n.main-nav > a { font-size: 12px; font-weight: 550; position: relative; }\n.main-nav > a:not(.button) { padding-block: 10px; }\n.main-nav > a:not(.button)::after { content: ''; position: absolute; bottom: 3px; left: 0; height: 1px; width: 0; background: var(--clay); transition: width .2s; }\n.main-nav > a[aria-current]:not(.button)::after, .main-nav > a:hover:not(.button)::after { width: 100%; }\n.menu-toggle { display: none; border: 0; background: none; min-height: 44px; padding: 8px 0 8px 12px; gap: 12px; align-items: center; }\n.menu-label { font-size: 12px; }\n.menu-lines { display: block; position: relative; width: 23px; height: 13px; border-top: 1px solid; border-bottom: 1px solid; }\n.menu-lines::after { content: ''; position: absolute; left: 0; top: 5px; width: 23px; border-top: 1px solid; }\n.menu-toggle[aria-expanded=true] .menu-lines { border: 0; }\n.menu-toggle[aria-expanded=true] .menu-lines::before, .menu-toggle[aria-expanded=true] .menu-lines::after { content: ''; position: absolute; inset: 5px 0 auto; width: 23px; border-top: 1px solid; transform: rotate(45deg); }\n.menu-toggle[aria-expanded=true] .menu-lines::after { transform: rotate(-45deg); }\n\n/* The paint-swatch hero is CSS artwork, not a purported project photograph. */\n.hero { padding-block: 62px 64px; }\n.hero-grid { display: grid; grid-template-columns: 1.03fr 1fr; align-items: center; gap: 60px; }\n.hero-copy { padding-block: 14px; }\n.hero-copy .eyebrow { display: flex; align-items: center; gap: 9px; margin-bottom: 28px; font nt.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"service-detail section\" id=\"interiors\">\u003cdiv class=\"container service-detail-grid\">\u003cdiv aria-hidden=\"true\" class=\"service-detail-art art-interior\">\u003cspan class=\"art-shape\">\u003c/span>\u003cspan class=\"art-lines\">\u003c/span>\u003cspan class=\"art-circle\">\u003c/span>\u003cspan class=\"detail-art-text\">Make room\u003cbr/>for \u003cem>you.\u003c/em>\u003c/span>\u003cspan class=\"art-caption\">01 / INTERIORS\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"eyebrow\">01 \u00a0 / \u00a0 INSIDE YOUR HOME\u003c/span>\u003ch2>A fresh perspective.\u003cbr/>\u003cem>Room by room.\u003c/em>\u003c/h2>\u003cp>Whether you're rethinking one room or refreshing several, the finish should feel right for the way you live.\u003c/p>\u003cp>From walls and ceilings to doors and woodwork, talk to us about the colours, surfaces and details you have in mind.\u003c/p>\u003cul class=\"detail-list\">\u003cli>Walls and ceilings\u003c/li>\u003cli>Doors, frames and interior woodwork\u003c/li>\u003cli>Hallways, stairs and landings\u003c/li>\u003cli>Bedrooms, kitchens and living spaces\u003c/li>\u003c/ul>\u003ca class=\"text-link\" href=\"../contact/index.html\">Tell us about your interior \u003csvg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"24\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"service-detail section alt-section\" id=\"exteriors\">\u003cdiv class=\"container service-detail-grid reverse\">\u003cdiv aria-hidden=\"true\" class=\"service-detail-art art-exterior\">\u003cspan class=\"art-shape\">\u003c/span>\u003cspan class=\"art-lines\">\u003c/span>\u003cspan class=\"art-circle\">\u003c/span>\u003cspan class=\"detail-art-text\">A welcome\u003cbr/>that \u003cem>lasts.\u003c/em>\u003c/span>\u003cspan class=\"art-caption\">02 / EXTERIORS\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"eyebrow\">02 \u00a0 / \u00a0 A GOOD FIRST IMPRESSION\u003c/span>\u003ch2>A little kerb appeal.\u003cbr/>\u003cem>A lot of care.\u003c/em>\u003c/h2>\u003cp>A freshly decorated exterior can change the whole feel of a home. From the front door to exterior walls, it starts with attention to the surface underneath.\u003c/p>\u003cp>Share a few photographs and tell us what needs attention. We can discuss the preparation and finish your project calls for.\u003c/p>\u003cul class=\"detail-list\">\u003cli>Exterior walls and painted surfaces\u003c/li>\u003cli>Windows, doors and external woodwork\u003c/li>\u003cli>Garage doors and outbuildings\u003c/li>\u003cli>Refreshing existing exterior finishes\u003c/li>\u003c/ul>\u003ca class=\"text-link\" href=\"../contact/index.html\">Talk about an exterior project \u003csvg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"24\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"service-detail section\" id=\"wallpaper\">\u003cdiv class=\"container service-detail-grid\">\u003cdiv aria-hidden=\"true\" class=\"service-detail-art art-detail\">\u003cspan class=\"art-shape\">\u003c/span>\u003cspan class=\"art-lines\">\u003c/span>\u003cspan class=\"art-circle\">\u003c/span>\u003cspan class=\"detail-art-text\">A little\u003cbr/>\u003cem>character.\u003c/em>\u003c/span>\u003cspan class=\"art-caption\">03 / WALLPAPER &amp; DETAIL\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"eyebrow\">03 \u00a0 / \u00a0 THE FINISHING TOUCHES\u003c/span>\u003ch2>Something subtle.\u003cbr/>\u003cem>Or a little statement.\u003c/em>\u003c/h2>\u003cp>Wallpaper brings pattern, texture and personality to a room. A chimney breast or feature wall can be just the place to start.\u003c/p>\u003cp>Tell us about your chosen paper and the space you're decorating, and we can talk through the next steps.\u003c/p>\u003cul class=\"detail-list\">\u003cli>Wallpaper hanging\u003c/li>\u003cli>Feature walls and chimney breasts\u003c/li>\u003cli>Bedroom and living-room wallpaper\u003c/li>\u003cli>Wallpaper alongside painted finishes\u003c/li>\u003c/ul>\u003ca class=\"text-link\" href=\"../contact/index.html\">Discuss your ideas \u003csvg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"24\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section process-section\">\u003cdiv class=\"container\">\u003cspan class=\"eyebrow\">KEEPING IT SIMPLE\u003c/span>\u003ch2>From first thought\u003cbr/>to \u003cem>final coat.\u003c/em>\u003c/h2>\u003cdiv class=\"process-grid\">\u003cdiv>\u003cspan>01\u003c/span>\u003ch3>Let's talk\u003c/h3>\u003cp>Tell us about your space, your ideas and where the property is.\u003c/p>\u003c/div>\u003cdiv>\u003cspan>02\u003c/span>\u003ch3>Make a plan\u003c/h3>\u003cp>Discuss the work, the finish and the practical details before making a start.\u003c/p>\u003c/div>\u003cdiv>\u003cspan>03\u003c/span>\u003ch3>Enjoy the change\u003c/h3>\u003cp>A fresh space, thoughtfully decorated and ready to feel like home.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"cta-section\">\u003cdiv class=\"container cta-inner\">\u003cdiv>\u003cspan class=\"eyebrow\">LET'S MAKE A START\u003c/span>\u003ch2>Ready for a \u003cem>refresh?\u003c/em>\u003c/h2>\u003cp>A room, a front door or a whole-home rethink. Tell us what you have in mind.\u003c/p>\u003c/div>\u003ca class=\"button\" href=\"../contact/index.html\">Let's talk about your project \u003csvg aria-hidden=\"true\" c ices\u003c/a>\u003ca href=\"../gallery/index.html\">Our work\u003c/a>\u003ca href=\"../about/index.html\">About Letts Decorate\u003c/a>\u003ca href=\"../testimonials/index.html\">Kind words\u003c/a>\u003c/div>\n\u003cdiv>\u003ch2>Say hello\u003c/h2>\u003ca href=\"tel:+447557990263\">07557 990263\u003c/a>\u003ca class=\"footer-email\" href=\"mailto:contact@lettsdecorate.co.uk\">contact@lettsdecorate.co.uk\u003c/a>\u003ca href=\"https://www.facebook.com/LettsDecorate\" rel=\"noopener noreferrer\" target=\"_blank\">Find us on Facebook \u003csvg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"24\">\u003cpath d=\"M6 18 18 6M6 6h12v12\">\u003c/path>\u003c/svg>\u003c/a>\u003c/div>\n\u003cdiv class=\"footer-area\">\u003ch2>Local roots\u003c/h2>\u003cp>Based in Ashford.\u003cbr/>Decorating homes across Kent.\u003cbr/>\u003cspan>Established 2015.\u003c/span>\u003c/p>\u003ca class=\"footer-text-link\" href=\"../contact/index.html\">Let's talk about your home \u003csvg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"24\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003c/div>\n\u003c/div>\u003cdiv class=\"container footer-bottom\">\u003cspan>\u00a9 \u003cspan data-year=\"\">2026\u003c/span> Letts Decorate\u003c/span>\u003cspan>Colour. Care. Craft.\u003c/span>\u003ca href=\"../privacy/index.html\">Website &amp; privacy\u003c/a>\u003c/div>\u003c/footer>\u003cdialog aria-labelledby=\"lightbox-caption\" class=\"lightbox\">\u003cdiv class=\"lightbox-bar\">\u003cspan class=\"lightbox-count\">\u003c/span>\u003cbutton aria-label=\"Close photograph\" class=\"icon-button lightbox-close\" type=\"button\">\u003csvg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"24\">\u003cpath d=\"m6 6 12 12M6 18 18 6\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003cdiv class=\"lightbox-stage\">\u003cbutton aria-label=\"Previous photograph\" class=\"icon-button lightbox-prev\" type=\"button\">\u003csvg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"24\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/button>\u003cimg alt=\"\" class=\"lightbox-image\"/>\u003cbutton aria-label=\"Next photograph\" class=\"icon-button lightbox-next\" type=\"button\">\u003csvg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"24\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003cp id=\"lightbox-caption\">\u003c/p>\u003c/dialog>\u003cscript>/*\n * Add your project photographs here, or use tools/gallery-helper.html.\n * Paths are relative to the site/ folder. Keep filenames lower-case, without spaces.\n * Allowed categories: \"interior\", \"exterior\", \"detail\".\n * Example (remove the surrounding comment and place the object inside the array):\n * {\n *   \"src\": \"assets/images/gallery/living-room.webp\",\n *   \"title\": \"Living room refresh\",\n *   \"alt\": \"Describe what is actually visible in this photograph\",\n *   \"category\": \"interior\",\n *   \"width\": 1600,\n *   \"height\": 1067\n * }\n * Do not add a customer's name or address without their permission.\n */\nwindow.LETTS_GALLERY = [];\n\u003c/script>\u003cscript>/* Plain JavaScript. No third-party scripts, cookies, tracking or network APIs. */\n(() => {\n  'use strict';\n  document.documentElement.classList.add('js');\n  const $ = (selector, root = document) => root.querySelector(selector);\n  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];\n  const menu = $('#main-nav');\n  const menuButton = $('.menu-toggle');\n  const closeMenu = () => {\n    if (!menu || !menuButton) return;\n    menu.classList.remove('is-open');\n    menuButton.setAttribute('aria-expanded', 'false');\n  };\n  menuButton?.addEventListener('click', () => {\n    const open = menuButton.getAttribute('aria-expanded') !== 'true';\n    menuButton.setAttribute('aria-expanded', String(open));\n    menu.classList.toggle('is-open', open);\n  });\n  menu?.addEventListener('click', (event) => {\n    if (event.target.closest('a')) closeMenu();\n  });\n  document.addEventListener('click', (event) => {\n    if (!event.target.closest('.site-header')) closeMenu();\n  });\n  document.addEventListener('keydown', (event) => {\n    if (event.key === 'Escape' && menuButton?.getAttribute('aria-expanded') === 'true') {\n      closeMenu();\n      menuButton.focus();\n    }\n  });\n  window.matchMedia('(min-width: 961px)').addEventListener('change', closeMenu);\n  $$('[data-year]').forEach(el => { el.textContent = String(new Date().getFullYear()); });\n\n  // A colour mood board only; the swatches do not refer to a manufacturer's paint code.\n  const stage = $('.palette-stage');\n  $$('.palette-button').forEach(button => button.addEventListener('click', () => {\n    const colour = button.dataset.colour;\n    if (!stage || !['sage', 'clay', 'sand'].includes(colour)) return;\n    stage.dataset.palette = colour;\n    $$('[data-palette-name]').forEach(el => { el.textContent = colour; });\n    $$('.palette-button').forEach(el => el.setAttribute('aria-pressed', String(el === button)));\n  }));\n\n  // Copy the address, or provide an honest fallback if clipboard access is unavailable.\n  $$('[data-copy-email]').forEach(button => button.addEventListener('click', async () => {\n    const status = $('.copy-status', button.closest('.contact-method'));\n    try {\n      if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');\n      await navigator.clipboard.writeText(button.dataset.copyEmail);\n      status.textContent = 'Email address copied.';\n    } catch {\n      status.textContent = 'Please select and copy the email address above.';\n    }\n  }));\n\n  const gallery = $('[data-gallery]');\n  if (!gallery) return;\n  const categoryNames = { interior: 'Interior decorating', exterior: 'Exterior decorating', detail: 'Wallpaper & detail' };\n  const root = gallery.dataset.root || '';\n  const limit = Number(gallery.dataset.limit) || Infinity;\n  const source = Array.isArray(window.LETTS_GALLERY) ? window.LETTS_GALLERY : [];\n  // Restrict image paths to local files. The gallery never injects author-supplied HTML.\n  const validPath = path => typeof path === 'string' && /^assets\\/images\\/gallery\\/[a-z0-9][a-z0-9._/-]*\\.(?:webp|avif|jpe?g|png)$/i.test(path) && !path.includes('..');\n  const photos = source.filter(item => item && validPath(item.src) &&\n    typeof item.title === 'string' && item.title.trim() &&\n    typeof item.alt === 'string' && item.alt.trim() && categoryNames[item.category]);\n  const hasPhotos = photos.length > 0;\n  const status = $('[data-gallery-status]');\n  const count = $('[data-gallery-count]');\n  const notice = $('[data-empty-notice]');\n  const originalPlaceholders = [...gallery.children];\n  let activeCategory = 'all';\n  let visiblePhotos = [];\n  let currentIndex = 0;\n  let lastTrigger = null;\n  const modal = $('.lightbox');\n  const modalImage = $('.lightbox-image', modal);\n  const modalCaption = $('#lightbox-caption', modal);\n  const modalCount = $('.lightbox-count', modal);\n  const previous = $('.lightbox-prev', modal);\n  const next = $('.lightbox-next', modal);\n  const close = $('.lightbox-close', modal);\n  if (hasPhotos) {\n    if (notice) notice.hidden = true;\n    $$('[data-gallery-intro]').forEach(el => {\n      el.textContent = 'A selection of interiors, exteriors and finishing touches. Take a closer look at our work.';\n    });\n  }\n  function updateModal(index) {\n    if (!visiblePhotos.length) return;\n    currentIndex = (index + visiblePhotos.length) % visiblePhotos.length;\n    const item = visiblePhotos[currentIndex];\n    modalImage.src = root + item.src;\n    modalImage.alt = item.alt;\n    modalCaption.textContent = item.title;\n    modalCount.textContent = `${currentIndex + 1} / ${visiblePhotos.length}`;\n    previous.disabled = next.disabled = visiblePhotos.length \u003c 2;\n  }\n  function openPhoto(index, trigger) {\n    if (!modal?.showModal) {\n      // Older browsers still get access to the photograph, without relying on popups.\n      window.location.href = root + visiblePhotos[index].src;\n      return;\n    }\n    lastTrigger = trigger;\n    updateModal(index);\n    modal.showModal();\n    document.body.classList.add('modal-open');\n    close.focus();\n  }\n  close?.addEventListener('click', () => modal.close());\n  previous?.addEventListener('click', () => updateModal(currentIndex - 1));\n  next?.addEventListener('click', () => updateModal(currentIndex + 1));\n  modal?.addEventListener('close', () => {\n    document.body.classList.remove('modal-open');\n    modalImage.removeAttribute('src');\n    lastTrigger?.focus();\n  });\n  modal?.addEventListener('click', event => {\n    if (event.target !== modal) return;\n    const rect = modal.getBoundingClientRect();\n    if (event.clientX \u003c rect.left || event.clientX > rect.right || event.clientY \u003c rect.top || event.clientY > rect.bottom) modal.close();\n  });\n  modal?.addEventListener('keydown', event => {\n    if (event.key === 'ArrowLeft') { event.preventDefault(); updateModal(currentIndex - 1); }\n    if (event.key === 'ArrowRight') { event.preventDefault(); updateModal(currentIndex + 1); }\n  });\n  modalImage?.addEventListener('error', () => {\n    modalCaption.textContent = 'This photograph could not be loaded. Please try again later.';\n  });\n  const make = (tag, className, text) => {\n    const el = document.createElement(tag);\n    if (className) el.className = className;\n    if (text !== undefined) el.textContent = text;\n    return el;\n  };\n  function render() {\n    if (!hasPhotos) {\n      let shown = 0;\n      originalPlaceholders.forEach(card => {\n        card.hidden = activeCategory !== 'all' && card.dataset.category !== activeCategory;\n        if (!card.hidden) shown++;\n      });\n      if (status) status.textContent = `${shown} gallery categories shown. Project photographs are coming soon.`;\n      return;\n    }\n    visiblePhotos = photos.filter(item => activeCategory === 'all' || item.category === activeCategory).slice(0, limit);\n    gallery.replaceChildren();\n    visiblePhotos.forEach((item, index) => {\n      const article = make('article', 'project-card');\n      const button = make('button', 'project-open');\n      button.type = 'button';\n      button.setAttribute('aria-label', `View photograph: ${item.title}`);\n      const imageWrap = make('span', 'project-image-wrap');\n      const image = make('img', 'project-photo');\n      image.alt = item.alt;\n      image.loading = 'lazy';\n      image.decoding = 'async';\n      if (Number.isInteger(item.width) && item.width > 0) image.width = item.width;\n      if (Number.isInteger(item.height) && item.height > 0) image.height = item.height;\n      image.src = root + item.src;\n      image.addEventListener('error', () => {\n        image.hidden = true;\n        imageWrap.append(make('span', 'project-load-error', 'Photograph temporarily unavailable.'));\n        button.disabled = true;\n      }, { once: true });\n      const expand = make('span', 'photo-enlarge', '+');\n      expand.setAttribute('aria-hidden', 'true');\n      imageWrap.append(image, expand);\n      const meta = make('div', 'project-meta');\n      const text = make('div');\n      text.append(make('span', 'project-kicker', categoryNames[item.category].toUpperCase()), make('h3', '', item.title));\n      const number = make('span', 'project-number', String(index + 1).padStart(2, '0'));\n      number.setAttribute('aria-hidden', 'true');\n      meta.append(text, number);\n      button.append(imageWrap);\n      button.addEventListener('click', () => openPhoto(index, button));\n      article.append(button, meta);\n      gallery.append(article);\n    });\n    if (!visiblePhotos.length) gallery.append(make('p', 'gallery-no-results', 'No photographs in this category yet. Try another category or get in touch.'));\n    const label = `${visiblePhotos.length} photograph${visiblePhotos.length === 1 ? '' : 's'}`;\n    if (count) count.textContent = label;\n    if (status) status.textContent = `${label} shown.`;\n  }\n  $$('[data-filter]').forEach(button => button.addEventListener('click', () => {\n    activeCategory = button.dataset.filter;\n    $$('[data-filter]').forEach(el => el.setAttribute('aria-pressed', String(el === button)));\n    render();\n  }));\n  render();\n})();\n\u003c/script>\u003cscript>\ndocument.addEventListener('click', function(event) {\n const a=event.target.closest('a[href]');\n if(!a||a.target==='_blank')return;\n const raw=a.getAttribute('href');\n if(raw.startsWith('#')){\n  event.preventDefault();\n  const target=document.getElementById(raw.slice(1));\n  if(target){target.scrollIntoView();if(raw==='#main'){target.tabIndex=-1;target.focus({preventScroll:true});}}\n  return;\n }\n const url=new URL(raw,document.baseURI);\n if(url.origin!=='https://preview.lettsdecorate.invalid')return;\n event.preventDefault();\n const parts=url.pathname.replace(/\\/index\\.html$/,'/').split('/').filter(Boolean);\n const key=parts.length?parts[0]:'home';\n parent.postMessage({type:'letts-preview-navigation',page:key,hash:url.hash},'*');\n});\n\u003c/script>\u003c/body>\u003c/html>", "gallery": "\u003c!DOCTYPE html>\n\n\u003chtml lang=\"en-GB\">\u003chead>\u003cbase href=\"https: n, a { -webkit-tap-highlight-color: transparent; }\nbutton { cursor: pointer; }\nbutton:disabled { cursor: default; opacity: .4; }\nimg { display: block; max-width: 100%; height: auto; }\nsvg { flex-shrink: 0; }\nfigure, blockquote { margin: 0; }\nh1, h2, h3, h4, p { margin-top: 0; }\nh1, h2 { font-family: var(--serif); font-weight: 400; letter-spacing: -.048em; }\nh1 { margin-bottom: 28px; font-size: clamp(52px, 6.3vw, 92px); line-height: 1.035; }\nh2 { margin-bottom: 25px; font-size: clamp(36px, 4.1vw, 58px); line-height: 1.12; }\nh3 { font-weight: 500; letter-spacing: -.028em; line-height: 1.28; }\nem { font-weight: 400; }\nh1 em, h2 em { color: var(--clay); }\np { margin-bottom: 20px; }\n::selection { background: #dcc7b0; color: #17291e; }\n:focus-visible { outline: 3px solid var(--clay); outline-offset: 5px; }\n[hidden] { display: none !important; }\n.container { width: min(1280px, calc(100% - 112px)); margin-inline: auto; }\n.section { padding-block: 108px; }\n.eyebrow { display: block; font-family: var(--sans); font-size: 10px; font-weight: 650; line-height: 1.6; letter-spacing: .17em; margin-bottom: 23px; }\n.icon { width: 21px; height: 21px; }\n.button { display: inline-flex; min-height: 54px; align-items: center; justify-content: center; gap: 24px; padding: 15px 23px; background: var(--clay); color: var(--white); border: 1px solid var(--clay); border-radius: 2px; font-size: 13px; font-weight: 600; line-height: 1.45; transition: background .2s, transform .2s; }\n.button:hover { background: var(--clay-dark); border-color: var(--clay-dark); transform: translateY(-2px); }\n.button:active { transform: translateY(0); }\n.button-small { min-height: 45px; padding: 12px 19px; font-size: 12px; gap: 22px; }\n.button-small .icon { width: 17px; height: 17px; }\n.text-link { width: fit-content; display: inline-flex; align-items: center; gap: 19px; padding-block: 7px; border-bottom: 1px solid currentColor; font-size: 13px; font-weight: 600; line-height: 1.5; }\n.text-link .icon, .service-link .icon { transition: transform .2s; width: 18px; height: 18px; }\n.text-link:hover .icon, .service-card:hover .icon:last-child { transform: translateX(4px); }\n.skip-link { position: fixed; top: 12px; left: 12px; transform: translateY(-180%); z-index: 500; background: var(--white); padding: 12px 20px; box-shadow: 0 4px 20px #0002; }\n.skip-link:focus { transform: none; }\n.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }\n\n/* Navigation */\n.site-header { position: sticky; top: 0; z-index: 50; background: rgba(248,246,240,.97); border-bottom: 1px solid var(--line); }\n.header-inner { min-height: 98px; display: flex; align-items: center; justify-content: space-between; gap: 30px; }\n.brand { display: inline-flex; align-items: center; gap: 13px; flex-shrink: 0; }\n.brand-icon { display: grid; place-items: center; width: 40px; height: 53px; border-radius: 2px; background: var(--dark); }\n.brand-icon img { width: 28px; height: 43px; object-fit: contain; }\n.brand-name { font-family: var(--serif); font-size: 26px; line-height: 1.18; letter-spacing: -.04em; }\n.brand-name > span { display: block; font-family: var(--sans); font-size: 8px; letter-spacing: .18em; font-weight: 600; margin-top: 5px; }\n.main-nav { display: flex; align-items: center; gap: 29px; }\n.main-nav > a { font-size: 12px; font-weight: 550; position: relative; }\n.main-nav > a:not(.button) { padding-block: 10px; }\n.main-nav > a:not(.button)::after { content: ''; position: absolute; bottom: 3px; left: 0; height: 1px; width: 0; background: var(--clay); transition: width .2s; }\n.main-nav > a[aria-current]:not(.button)::after, .main-nav > a:hover:not(.button)::after { width: 100%; }\n.menu-toggle { display: none; border: 0; background: none; min-height: 44px; padding: 8px 0 8px 12px; gap: 12px; align-items: center; }\n.menu-label { font-size: 12px; }\n.menu-lines { display: block; position: relative; width: 23px; height: 13px; border-top: 1px solid; border-bottom: 1px solid; }\n.menu-lines::after { content: ''; position: absolute; left: 0; top: 5px; width: 23px; border-top: 1px solid; }\n.menu-toggle[aria-expanded=true] .menu-lines { border: 0; }\n.menu-toggle[aria-expanded=true] .menu-lines::before, .menu-toggle[aria-expanded=true] .menu-lines::after { content: ''; position: absolute; inset: 5px 0 auto; width: 23px; border-top: 1px solid; transform: rotate(45deg); }\n.menu-toggle[aria-expanded=true] .menu-lines::after { transform: rotate(-45deg); }\n\n/* The paint-swatch hero is CSS artwork, not a purported project photograph. */\n.hero { padding-block: 62px 64px; }\n.hero-grid { display: grid; grid-template-columns: 1.03fr 1fr; align-items: center; gap: 60px; }\n.hero-copy { padding-block: 14px; }\n.hero-copy .eyebrow { display: flex; align-items: center; gap: 9px; margin-bottom: 28px; font-size: 9px; }\n.eyebrow-line { width: 27px; height: 1px; background: var(--clay); }\n.hero-copy h1 { font-size: clamp(64px, 6.5vw, 94px); margin-bottom: 25px; }\n.hero-copy h1 em { position: relative; padding-right: .08em; }\n.hero-copy > p { color: var(--muted); font-size: 16px; max-width: 355px; line-height: 1.85; margin-bottom: 27px; }\n.hero-actions { display: flex; align-items: flex-start; flex-direction: column; gap: 17px; }\n.hero-actions .text-link { border: 0; font-size: 12px; }\n.hero-footnote { margin-top: 37px; display: flex; align-items: center; gap: 13px; color: var(--muted); font-size: 10px; letter-spacing: .02em; }\n.hero-footnote span + span::before { content: '/'; margin-right: 13px; color: #90958b; }\n.hero-visual { min-width: 0; }\n.palette-stage { --swatch: #506555; --swatch-secondary: #b9664c; position: relative; background: #e9e5da; height: 533px; overflow: hidden; isolation: isolate; }\n.palette-stage[data-palette=clay] { --swatch: #98503c; --swatch-secondary: #bbaa88; }\n.palette-stage[data-palette=sand] { --swatch: #8c7450; --swatch-secondary: #69745e; }\n.stage-line { position: absolute; border: 1px solid #d1cebf; border-radius: 50%; }\n.line-one { width: 470px; height: 470px; top: -68px; left: -102px; }\n.line-two { width: 365px; height: 365px; bottom: -135px; right: -85px; }\n.stage-index { position: absolute; top: 27px; left: 25px; font-size: 8px; letter-spacing: .18em; color: #6f7569; }\n.stage-side { position: absolute; right: 17px; top: 132px; writing-mode: vertical-rl; font-size: 8px; letter-spacing: .19em; color: #656d61; }\n.swatch-sheet { position: absolute; background: #fffef7; padding: 11px; box-shadow: -9px 15px 27px -15px #273b3066, 4px 3px 8px #26342a15; }\n.swatch-front { width: 65%; height: 382px; top: 66px; left: 24%; transform: rotate(7deg); }\n.swatch-colour { position: relative; overflow: hidden; height: 305px; background: var(--swatch); transition: background .45s; color: #fffaf0; }\n.swatch-colour::after { content: ''; position: absolute; inset: 0; background: linear-gradient(125deg, #ffffff06, #00000004); }\n.swatch-arch { position: absolute; top: 26px; left: 29%; width: 78%; height: 92%; border: 1px solid #ffffff38; border-radius: 150px 150px 0 0; }\n.swatch-arch::before, .swatch-arch::after { content: ''; position: absolute; inset: 13px; border: 1px solid #ffffff19; border-radius: inherit; }\n.swatch-arch::after { inset: 26px; }\n.swatch-grain { position: absolute; inset: 0; opacity: .08; background: repeating-linear-gradient(88deg, transparent 0 3px, #fff3 4px, transparent 5px); }\n.swatch-type { position: absolute; left: 24px; bottom: 35px; font-size: clamp(30px, 3.5vw, 49px); line-height: 1.08; font-family: var(--serif); letter-spacing: -.04em; }\n.swatch-label { display: flex; align-items: center; justify-content: space-between; padding: 15px 5px 0; font-size: 8px; font-weight: 650; letter-spacing: .14em; }\n.swatch-label > span > span { display: block; margin-top: 2px; font-size: 6px; letter-spacing: .1em; font-weight: 400; }\n.swatch-label .icon { width: 17px; height: 17px; }\n.swatch-back { width: 55%; height: 326px; top: 145px; left: 10%; transform: rotate(-13deg); }\n.swatch-back-colour { width: 100%; height: 262px; background: var(--swatch-secondary); transition: background .45s; }\n.swatch-back > span { display: block; font-size: 7px; letter-spacing: .16em; padding: 12px 4px; }\n.palette-caption { position: absolute; bottom: 20px; left: 27px; right: 26px; display: flex; align-items: center; gap: 8px; font-size: 9px; }\n.palette-caption strong { font-weight: 600; }\n.palette-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--swatch); transition: background .45s; }\n.palette-caption-number { margin-left: auto; color: #6c7469; font-size: 8px; letter-spacing: .1em; }\n.palette-controls { display: flex; align-items: center; justify-content: space-between; margin-top: 17px; gap: 16px; font-size: 10px; color: var(--muted); }\n.swatch-buttons { display: flex; gap: 4px; }\n.palette-button { display: grid; place-items: center; width: 35px; height: 35px; background: none; border: 1px solid transparent; border-radius: 50%; padding: 4px; }\n.palette-button span { width: 23px; height: 23px; border-radius: 50%; background: var(--swatch); }\n.palette-button[aria-pressed=true] { border-color: var(--ink); }\n.palette-sage { --swatch: #506555; }\n.palette-clay { --swatch: #98503c; }\n.palette-sand { --swatch: #8c7450; }\n\n/* Intro, services and work */\n.trust-strip { background: var(--dark); color: var(--paper); padding-block: 28px; }\n.trust-inner { display: grid; grid-template-columns: 1.05fr 1fr 1.05fr 1fr; align-items: center; gap: 27px; }\n.trust-inner > p { font-family: var(--serif); font-size: 21px; line-height: 1.3; letter-spacing: -.025em; margin: 0; }\n.trust-inner > span { display: flex; align-items: center; justify-content: center; border-left: 1px solid #ffffff26; padding-block: 12px; gap: 12px; font-size: 11px; }\n.trust-inner .icon { color: #c8cfbb; width: 21px; }\n.section-heading { display: flex; justify-cont ge\"/>\u003cbutton aria-label=\"Next photograph\" class=\"icon-button lightbox-next\" type=\"button\">\u003csvg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"24\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003cp id=\"lightbox-caption\">\u003c/p>\u003c/dialog>\u003cscript>/*\n * Add your project photographs here, or use tools/gallery-helper.html.\n * Paths are relative to the site/ folder. Keep filenames lower-case, without spaces.\n * Allowed categories: \"interior\", \"exterior\", \"detail\".\n * Example (remove the surrounding comment and place the object inside the array):\n * {\n *   \"src\": \"assets/images/gallery/living-room.webp\",\n *   \"title\": \"Living room refresh\",\n *   \"alt\": \"Describe what is actually visible in this photograph\",\n *   \"category\": \"interior\",\n *   \"width\": 1600,\n *   \"height\": 1067\n * }\n * Do not add a customer's name or address without their permission.\n */\nwindow.LETTS_GALLERY = [];\n\u003c/script>\u003cscript>/* Plain JavaScript. No third-party scripts, cookies, tracking or network APIs. */\n(() => {\n  'use strict';\n  document.documentElement.classList.add('js');\n  const $ = (selector, root = document) => root.querySelector(selector);\n  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];\n  const menu = $('#main-nav');\n  const menuButton = $('.menu-toggle');\n  const closeMenu = () => {\n    if (!menu || !menuButton) return;\n    menu.classList.remove('is-open');\n    menuButton.setAttribute('aria-expanded', 'false');\n  };\n  menuButton?.addEventListener('click', () => {\n    const open = menuButton.getAttribute('aria-expanded') !== 'true';\n    menuButton.setAttribute('aria-expanded', String(open));\n    menu.classList.toggle('is-open', open);\n  });\n  menu?.addEventListener('click', (event) => {\n    if (event.target.closest('a')) closeMenu();\n  });\n  document.addEventListener('click', (event) => {\n    if (!event.target.closest('.site-header')) closeMenu();\n  });\n  document.addEventListener('keydown', (event) => {\n    if (event.key === 'Escape' && menuButton?.getAttribute('aria-expanded') === 'true') {\n      closeMenu();\n      menuButton.focus();\n    }\n  });\n  window.matchMedia('(min-width: 961px)').addEventListener('change', closeMenu);\n  $$('[data-year]').forEach(el => { el.textContent = String(new Date().getFullYear()); });\n\n  // A colour mood board only; the swatches do not refer to a manufacturer's paint code.\n  const stage = $('.palette-stage');\n  $$('.palette-button').forEach(button => button.addEventListener('click', () => {\n    const colour = button.dataset.colour;\n    if (!stage || !['sage', 'clay', 'sand'].includes(colour)) return;\n    stage.dataset.palette = colour;\n    $$('[data-palette-name]').forEach(el => { el.textContent = colour; });\n    $$('.palette-button').forEach(el => el.setAttribute('aria-pressed', String(el === button)));\n  }));\n\n  // Copy the address, or provide an honest fallback if clipboard access is unavailable.\n  $$('[data-copy-email]').forEach(button => button.addEventListener('click', async () => {\n    const status = $('.copy-status', button.closest('.contact-method'));\n    try {\n      if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');\n      await navigator.clipboard.writeText(button.dataset.copyEmail);\n      status.textContent = 'Email address copied.';\n    } catch {\n      status.textContent = 'Please select and copy the email address above.';\n    }\n  }));\n\n  const gallery = $('[data-gallery]');\n  if (!gallery) return;\n  const categoryNames = { interior: 'Interior decorating', exterior: 'Exterior decorating', detail: 'Wallpaper & detail' };\n  const root = gallery.dataset.root || '';\n  const limit = Number(gallery.dataset.limit) || Infinity;\n  const source = Array.isArray(window.LETTS_GALLERY) ? window.LETTS_GALLERY : [];\n  // Restrict image paths to local files. The gallery never injects author-supplied HTML.\n  const validPath = path => typeof path === 'string' && /^assets\\/images\\/gallery\\/[a-z0-9][a-z0-9._/-]*\\.(?:webp|avif|jpe?g|png)$/i.test(path) && !path.includes('..');\n  const photos = source.filter(item => item && validPath(item.src) &&\n    typeof item.title === 'string' && item.title.trim() &&\n    typeof item.alt === 'string' && item.alt.trim() && categoryNames[item.category]);\n  const hasPhotos = photos.length > 0;\n  const status = $('[data-gallery-status]');\n  const count = $('[data-gallery-count]');\n  const notice = $('[data-empty-notice]');\n  const originalPlaceholders = [...gallery.children];\n  let activeCategory = 'all';\n  let visiblePhotos = [];\n  let currentIndex = 0;\n  let lastTrigger = null;\n  const modal = $('.lightbox');\n  const modalImage = $('.lightbox-image', modal);\n  const modalCaption = $('#lightbox-caption', modal);\n  const modalCount = $('.lightbox-count', modal);\n  const previous = $('.lightbox-prev', modal);\n  const next = $('.lightbox-next', modal);\n  const close = $('.lightbox-close', modal);\n  if (hasPhotos) {\n    if (notice) notice.hidden = true;\n    $$('[data-gallery-intro]').forEach(el => {\n      el.textContent = 'A selection of interiors, exteriors and finishing touches. Take a closer look at our work.';\n    });\n  }\n  function updateModal(index) {\n    if (!visiblePhotos.length) return;\n    currentIndex = (index + visiblePhotos.length) % visiblePhotos.length;\n    const item = visiblePhotos[currentIndex];\n    modalImage.src = root + item.src;\n    modalImage.alt = item.alt;\n    modalCaption.textContent = item.title;\n    modalCount.textContent = `${currentIndex + 1} / ${visiblePhotos.length}`;\n    previous.disabled = next.disabled = visiblePhotos.length \u003c 2;\n  }\n  function openPhoto(index, trigger) {\n    if (!modal?.showModal) {\n      // Older browsers still get access to the photograph, without relying on popups.\n      window.location.href = root + visiblePhotos[index].src;\n      return;\n    }\n    lastTrigger = trigger;\n    updateModal(index);\n    modal.showModal();\n    document.body.classList.add('modal-open');\n    close.focus();\n  }\n  close?.addEventListener('click', () => modal.close());\n  previous?.addEventListener('click', () => updateModal(currentIndex - 1));\n  next?.addEventListener('click', () => updateModal(currentIndex + 1));\n  modal?.addEventListener('close', () => {\n    document.body.classList.remove('modal-open');\n    modalImage.removeAttribute('src');\n    lastTrigger?.focus();\n  });\n  modal?.addEventListener('click', event => {\n    if (event.target !== modal) return;\n    const rect = modal.getBoundingClientRect();\n    if (event.clientX \u003c rect.left || event.clientX > rect.right || event.clientY \u003c rect.top || event.clientY > rect.bottom) modal.close();\n  });\n  modal?.addEventListener('keydown', event => {\n    if (event.key === 'ArrowLeft') { event.preventDefault(); updateModal(currentIndex - 1); }\n    if (event.key === 'ArrowRight') { event.preventDefault(); updateModal(currentIndex + 1); }\n  });\n  modalImage?.addEventListener('error', () => {\n    modalCaption.textContent = 'This photograph could not be loaded. Please try again later.';\n  });\n  const make = (tag, className, text) => {\n    const el = document.createElement(tag);\n    if (className) el.className = className;\n    if (text !== undefined) el.textContent = text;\n    return el;\n  };\n  function render() {\n    if (!hasPhotos) {\n      let shown = 0;\n      originalPlaceholders.forEach(card => {\n        card.hidden = activeCategory !== 'all' && card.dataset.category !== activeCategory;\n        if (!card.hidden) shown++;\n      });\n      if (status) status.textContent = `${shown} gallery categories shown. Project photographs are coming soon.`;\n      return;\n    }\n    visiblePhotos = photos.filter(item => activeCategory === 'all' || item.category === activeCategory).slice(0, limit);\n    gallery.replaceChildren();\n    visiblePhotos.forEach((item, index) => {\n      const article = make('article', 'project-card');\n      const button = make('button', 'project-open');\n      button.type = 'button';\n      button.setAttribute('aria-label', `View photograph: ${item.title}`);\n      const imageWrap = make('span', 'project-image-wrap');\n      const image = make('img', 'project-photo');\n      image.alt = item.alt;\n      image.loading = 'lazy';\n      image.decoding = 'async';\n      if (Number.isInteger(item.width) && item.width > 0) image.width = item.width;\n      if (Number.isInteger(item.height) && item.height > 0) image.height = item.height;\n      image.src = root + item.src;\n      image.addEventListener('error', () => {\n        image.hidden = true;\n        imageWrap.append(make('span', 'project-load-error', 'Photograph temporarily unavailable.'));\n        button.disabled = true;\n      }, { once: true });\n      const expand = make('span', 'photo-enlarge', '+');\n      expand.setAttribute('aria-hidden', 'true');\n      imageWrap.append(image, expand);\n      const meta = make('div', 'project-meta');\n      const text = make('div');\n      text.append(make('span', 'project-kicker', categoryNames[item.category].toUpperCase()), make('h3', '', item.title));\n      const number = make('span', 'project-number', String(index + 1).padStart(2, '0'));\n      number.setAttribute('aria-hidden', 'true');\n      meta.append(text, number);\n      button.append(imageWrap);\n      button.addEventListener('click', () => openPhoto(index, button));\n      article.append(button, meta);\n      gallery.append(article);\n    });\n    if (!visiblePhotos.length) gallery.append(make('p', 'gallery-no-results', 'No photographs in this category yet. Try another category or get in touch.'));\n    const label = `${visiblePhotos.length} photograph${visiblePhotos.length === 1 ? '' : 's'}`;\n    if (count) count.textContent = label;\n    if (status) status.textContent = `${label} shown.`;\n  }\n  $$('[data-filter]').forEach(button => button.addEventListener('click', () => {\n    activeCategory = button.dataset.filter;\n    $$('[data-filter]').forEach(el => el.setAttribute('aria-pressed', String(el === button)));\n    render();\n  }));\n  render();\n})();\n\u003c/script>\u003cscript>\ndocument.addEventListener('click', function(event) {\n const a=event.target.closest('a[href]');\n if(!a||a.target==='_blank')return;\n const raw=a.getAttribute('href');\n if(raw.startsWith('#')){\n  event.preventDefault();\n  const target=document.getElementById(raw.slice(1));\n  if(target){target.scrollIntoView();if(raw==='#main'){target.tabIndex=-1;target.focus({preventScroll:true});}}\n  return;\n }\n const url=new URL(raw,document.baseURI);\n if(url.origin!=='https://preview.lettsdecorate.invalid')return;\n event.preventDefault();\n const parts=url.pathname.replace(/\\/index\\.html$/,'/').split('/').filter(Boolean);\n const key=parts.length?parts[0]:'home';\n parent.postMessage({type:'letts-preview-navigation',page:key,hash:url.hash},'*');\n});\n\u003c/script>\u003c/body>\u003c/html>", "about": "\u003c!DOCTYPE html>\n\n\u003chtml lang=\"en-GB\">\u003chead>\u003cbase href=\"https://preview.lettsdecorate.invalid/about/\">\u003cmeta charset=\"utf-8\"/>\u003cmeta content=\"width=device-width, initial-scale=1\" name=\"viewport\"/>\u003cmeta content=\"#24352f\" name=\"theme-color\"/>\u003ctitle>About Letts Decorate | Painting &amp; Decorating in Ashford\u003c/title>\u003cmeta content=\"The story behind Letts Decorate, founded in Ashford in 2015 by Scott Taylor. A local painting and decorating business with a personal approach.\" name=\"description\"/>\u003clink href=\"https://lettsdecorate.co.uk/about/\" rel=\"canonical\"/>\u003cmeta content=\"website\" property=\"og:type\"/>\u003cmeta content=\"Letts Decorate\" property=\"og:site_name\"/>\ YjhYDAeL4WAxHCyGg8VwsBgOFsPBYjhqSbzzAsNRUWbZwTCIoBCWlAxHTT4lKIZ/0w8W33dcO9PQGY4+7d63p7O7q6xzmHUrH504fqSjvaYCEMMBmggAdu/b+/7uXeY1P0M+YF7s8ubbGz84dBBraa09w9H3duPeQmHt44/2FgpSSqU1FaWUsizrZGfnE//1VKxf/zMGycapWebDZBL7PzjQcezoH5+/oC6VwqKEEO1HO+5d/a8b3nit1ha9MRyD+Ni+871Nm98peF6mrs7z/UNHDj+9/tlVP3zwtbfexNrbvIW3YGBxzsFiOFgMB4vhYDEcLIaDxXCwGA4Ww8FiOFgshoPFcLAYDhbDwWI4WAwHi+FgxV3/D4oKxl13FlKVAAAAAElFTkSuQmCC\" rel=\"apple-touch-icon\"/>\u003cstyle>/* Letts Decorate -- a warm, editorial, dependency-free static site.\n   Change the core colour palette here. No external fonts or stylesheets are loaded. */\n:root {\n  --paper: #f8f6f0;\n  --white: #fffefa;\n  --ink: #263a32;\n  --muted: #646a62;\n  --clay: #ab4430;\n  --clay-dark: #8c3525;\n  --sage: #506555;\n  --sand: #d2bea0;\n  --line: #d9dacf;\n  --soft: #efede5;\n  --dark: #24352f;\n  --serif: Georgia, 'Times New Roman', serif;\n  --sans: 'Segoe UI', Arial, Helvetica, sans-serif;\n}\n*, *::before, *::after { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; scroll-padding-top: 112px; }\nbody { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }\nbody.modal-open { overflow: hidden; }\na { color: inherit; text-decoration: none; }\nbutton, input, select { font: inherit; }\nbutton { color: inherit; }\nbutton, a { -webkit-tap-highlight-color: transparent; }\nbutton { cursor: pointer; }\nbutton:disabled { cursor: default; opacity: .4; }\nimg { display: block; max-width: 100%; height: auto; }\nsvg { flex-shrink: 0; }\nfigure, blockquote { margin: 0; }\nh1, h2, h3, h4, p { margin-top: 0; }\nh1, h2 { font-family: var(--serif); font-weight: 400; letter-spacing: -.048em; }\nh1 { margin-bottom: 28px; font-size: clamp(52px, 6.3vw, 92px); line-height: 1.035; }\nh2 { margin-bottom: 25px; font-size: clamp(36px, 4.1vw, 58px); line-height: 1.12; }\nh3 { font-weight: 500; letter-spacing: -.028em; line-height: 1.28; }\nem { font-weight: 400; }\nh1 em, h2 em { color: var(--clay); }\np { margin-bottom: 20px; }\n::selection { background: #dcc7b0; color: #17291e; }\n:focus-visible { outline: 3px solid var(--clay); outline-offset: 5px; }\n[hidden] { display: none !important; }\n.container { width: min(1280px, calc(100% - 112px)); margin-inline: auto; }\n.section { padding-block: 108px; }\n.eyebrow { display: block; font-family: var(--sans); font-size: 10px; font-weight: 650; line-height: 1.6; letter-spacing: .17em; margin-bottom: 23px; }\n.icon { width: 21px; height: 21px; }\n.button { display: inline-flex; min-height: 54px; align-items: center; justify-content: center; gap: 24px; padding: 15px 23px; background: var(--clay); color: var(--white); border: 1px solid var(--clay); border-radius: 2px; font-size: 13px; font-weight: 600; line-height: 1.45; transition: background .2s, transform .2s; }\n.button:hover { background: var(--clay-dark); border-color: var(--clay-dark); transform: translateY(-2px); }\n.button:active { transform: translateY(0); }\n.button-small { min-height: 45px; padding: 12px 19px; font-size: 12px; gap: 22px; }\n.button-small .icon { width: 17px; height: 17px; }\n.text-link { width: fit-content; display: inline-flex; align-items: center; gap: 19px; padding-block: 7px; border-bottom: 1px solid currentColor; font-size: 13px; font-weight: 600; line-height: 1.5; }\n.text-link .icon, .service-link .icon { transition: transform .2s; width: 18px; height: 18px; }\n.text-link:hover .icon, .service-card:hover .icon:last-child { transform: translateX(4px); }\n.skip-link { position: fixed; top: 12px; left: 12px; transform: translateY(-180%); z-index: 500; background: var(--white); padding: 12px 20px; box-shadow: 0 4px 20px #0002; }\n.skip-link:focus { transform: none; }\n.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }\n\n/* Navigation */\n.site-header { position: sticky; top: 0; z-index: 50; background: rgba(248,246,240,.97); border-bottom: 1px solid var(--line); }\n.header-inner { min-height: 98px; display: flex; align-items: center; justify-content: space-between; gap: 30px; }\n.brand { display: inline-flex; align-items: center; gap: 13px; flex-shrink: 0; }\n.brand-icon { display: grid; place-items: center; width: 40px; height: 53px; border-radius: 2px; background: var(--dark); }\n.brand-icon img { width: 28px; height: 43px; object-fit: contain; }\n.brand-name { font-family: var(--serif); font-size: 26px; line-height: 1.18; letter-spacing: -.04em; }\n.brand-name > span { display: block; font-family: var(--sans); font-size: 8px; letter-spacing: .18em; font-weight: 600; margin-top: 5px; }\n.main-nav { display: flex; align-items: center; gap: 29px; }\n.main-nav > a { font-size: 12px; font-weight: 550; position: relative; }\n.main-nav > a:not(.button) { padding-block: 10px; }\n.main-nav > a:not(.button)::after { content: ''; position: absolute; bottom: 3px; left: 0; height: 1px; width: 0; background: var(--clay); transition: width .2s; }\n.main-nav > a[aria-current]:not(.button)::after, .main-nav > a:hover:not(.button)::after { width: 100%; }\n.menu-toggle { display: none; border: 0; background: none; min-height: 44px; padding: 8px 0 8px 12px; gap: 12px; align-items: center; }\n.menu-label { font-size: 12px; }\n.menu-lines { display: block; position: relative; width: 23px; height: 13px; border-top: 1px solid; border-bottom: 1px solid; }\n.menu-lines::after { content: ''; position: absolute; left: 0; top: 5px; width: 23px; border-top: 1px solid; }\n.menu-toggle[aria-expanded=true] .menu-lines { border: 0; }\n.menu-toggle[aria-expanded=true] .menu-lines::before, .menu-toggle[aria-expanded=true] .menu-lines::after { content: ''; position: absolute; inset: 5px 0 auto; width: 23px; border-top: 1px solid; transform: rotate(45deg); }\n.menu-toggle[aria-expanded=true] .menu-lines::after { transform: rotate(-45deg); }\n\n/* The paint-swatch hero is CSS artwork, not a purpo class=\"container story-grid\">\u003cdiv>\u003cspan class=\"eyebrow\">THE STORY BEHIND THE NAME\u003c/span>\u003ch2>More than\u003cbr/>\u003cem>a coat of paint.\u003c/em>\u003c/h2>\u003c/div>\u003cdiv class=\"prose\">\u003cp class=\"lead\">Scott established Letts Decorate in 2015, naming the company in memory of his late father, Garry Letts.\u003c/p>\u003cp>After studying painting and decorating at Folkestone College between 2008 and 2010, he built hands-on experience working for other companies before starting his own.\u003c/p>\u003cp>That personal connection shapes the business: taking pride in the work, treating customers with care, and helping people feel at ease with their choice of style and colour.\u003c/p>\u003cp>Based in Ashford and working across Kent, Letts Decorate has grown through customers recommending the business to friends and family.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section values-section\">\u003cdiv class=\"container\">\u003cspan class=\"eyebrow\">THE WAY WE WORK\u003c/span>\u003ch2>Small details.\u003cbr/>\u003cem>They matter.\u003c/em>\u003c/h2>\u003cdiv class=\"values-grid\">\u003carticle>\u003cspan class=\"value-number\">01 /\u003c/span>\u003ch3>Care for your home\u003c/h3>\u003cp>Decorating is personal. So is being invited into someone's home. A considerate approach matters from the start.\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"value-number\">02 /\u003c/span>\u003ch3>Pride in the finish\u003c/h3>\u003cp>The edges, the preparation and the final details all play a part in making the result feel right.\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"value-number\">03 /\u003c/span>\u003ch3>Space for your ideas\u003c/h3>\u003cp>It's your home and your style. Let's talk through the look you'd like to create.\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"cta-section\">\u003cdiv class=\"container cta-inner\">\u003cdiv>\u003cspan class=\"eyebrow\">LET'S MAKE A START\u003c/span>\u003ch2>Ready for a \u003cem>refresh?\u003c/em>\u003c/h2>\u003cp>A room, a front door or a whole-home rethink. Tell us what you have in mind.\u003c/p>\u003c/div>\u003ca class=\"button\" href=\"../contact/index.html\">Let's talk about your project \u003csvg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"24\">\u003cpath d=\"M6 18 18 6M6 6h12v12\">\u003c/path>\u003c/svg>\u003c/a>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"site-footer\">\u003cdiv class=\"container footer-grid\">\n\u003cdiv class=\"footer-brand\">\u003cimg alt=\"Letts Decorate - Professional Decorating Service\" height=\"266\" loading=\"eager\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAAEKCAYAAACoiGheAAAABGdBTUEAALGPC/xhBQAAAAFzUkdCAK7OHOkAAAAgY0hSTQAAeiYAAICEAAD6AAAAgOgAAHUwAADqYAAAOpgAABdwnLpRPAAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAAuIwAALiMBeKU/dgAAN4NJREFUeNrtnXeYXVX1/j/7Ts2kdyYBQggJgVBCC6CASAm9CEi1IP4QEZAiRRCRKgKCSJUi8qWIAgIiilQpIhCKELqEUJKQhPQ+yZT1+2O/xzm53jsz905Nst7nmSeTueecu8/aa797rbXXXjvgcLQC7/QeWlKfsf1qM3ZDfYaHgdPHzZq+2CXjaA9kXASOVpBVpj5jO9dm7Mr6DNXAN4BzJwys7u7ScThhOboWWQXbuS7D9fUZ1tefuwMnAj+dMLC6yqXkcMJydB2yKuGGuoxtmPVxQlonO2k52hrBReAowg0cX5uxa+ozjGzi0sXAr4FfeEzL4YTl6EyyurY+wwYtuGUpcDVwaaGkNWFgdQYYAwzMc8kK4PVxs6Yv9Z5Zc1DqInC0kKxCfcZ2L4CsAKqAU0RAhZJWGXA6cECez2cA+wKTvHfWHHgMy9EisgJ2rQ9cXQBZZZPW2RMGVvco0PqvAnrn+enl+uuE5XDkIqu9gGtLG8LojBX1mIS0zpgwsLqnS9XhhOVoT7L6NTA6Y1BRl6EVpHUGcKaTlsMJy9GeZPVfN7CVpNUN+JGTlsMJy9HWZLUrcGWarJy0HE5Yjq5KVtcCo/MqjpOWwwnL0clklQHGN0dWbUxaP3LScjhhOYolq+taQlY5SKsY2uoGnOmWlsMJy1GsZbVBwUpkzC2rD9cB/4aCicvdQ4cTlqMgstoZuKYYsgLmAhdlLJwBfM9Jy+GE5WgvsioBvgrcAE1uZG6KrC4Hbth0/rTlwGvAccDrrSCt0wvMiHc4YTnWELLaFbgZ2LBYywr41ZgF01YAjJs13URa3wXeKJK0TgfOBpy0HE5YjpXI6kb4b/G9YsjqhoSsEoi0Jso9LIa0km08P9bvDocTlpNV25NVFmm91krSOgHY0XvM4YS1ZpPVju1JVm1IWpWAB+AdTlhruGX12yLJaj7w05aQVQ7S+g7wShGk5XA4YbkbWDRZ3dZS dby=\"lightbox-caption\" class=\"lightbox\">\u003cdiv class=\"lightbox-bar\">\u003cspan class=\"lightbox-count\">\u003c/span>\u003cbutton aria-label=\"Close photograph\" class=\"icon-button lightbox-close\" type=\"button\">\u003csvg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"24\">\u003cpath d=\"m6 6 12 12M6 18 18 6\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003cdiv class=\"lightbox-stage\">\u003cbutton aria-label=\"Previous photograph\" class=\"icon-button lightbox-prev\" type=\"button\">\u003csvg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"24\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/button>\u003cimg alt=\"\" class=\"lightbox-image\"/>\u003cbutton aria-label=\"Next photograph\" class=\"icon-button lightbox-next\" type=\"button\">\u003csvg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"24\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\" viewbox=\"0 0 24 24\" width=\"24\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003cp id=\"lightbox-caption\">\u003c/p>\u003c/dialog>\u003cscript>/*\n * Add your project photographs here, or use tools/gallery-helper.html.\n * Paths are relative to the site/ folder. Keep filenames lower-case, without spaces.\n * Allowed categories: \"interior\", \"exterior\", \"detail\".\n * Example (remove the surrounding comment and place the object inside the array):\n * {\n *   \"src\": \"assets/images/gallery/living-room.webp\",\n *   \"title\": \"Living room refresh\",\n *   \"alt\": \"Describe what is actually visible in this photograph\",\n *   \"category\": \"interior\",\n *   \"width\": 1600,\n *   \"height\": 1067\n * }\n * Do not add a customer's name or address without their permission.\n */\nwindow.LETTS_GALLERY = [];\n\u003c/script>\u003cscript>/* Plain JavaScript. No third-party scripts, cookies, tracking or network APIs. */\n(() => {\n  'use strict';\n  document.documentElement.classList.add('js');\n  const $ = (selector, root = document) => root.querySelector(selector);\n  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];\n  const menu = $('#main-nav');\n  const menuButton = $('.menu-toggle');\n  const closeMenu = () => {\n    if (!menu || !menuButton) return;\n    menu.classList.remove('is-open');\n    menuButton.setAttribute('aria-expanded', 'false');\n  };\n  menuButton?.addEventListener('click', () => {\n    const open = menuButton.getAttribute('aria-expanded') !== 'true';\n    menuButton.setAttribute('aria-expanded', String(open));\n    menu.classList.toggle('is-open', open);\n  });\n  menu?.addEventListener('click', (event) => {\n    if (event.target.closest('a')) closeMenu();\n  });\n  document.addEventListener('click', (event) => {\n    if (!event.target.closest('.site-header')) closeMenu();\n  });\n  document.addEventListener('keydown', (event) => {\n    if (event.key === 'Escape' && menuButton?.getAttribute('aria-expanded') === 'true') {\n      closeMenu();\n      menuButton.focus();\n    }\n  });\n  window.matchMedia('(min-width: 961px)').addEventListener('change', closeMenu);\n  $$('[data-year]').forEach(el => { el.textContent = String(new Date().getFullYear()); });\n\n  // A colour mood board only; the swatches do not refer to a manufacturer's paint code.\n  const stage = $('.palette-stage');\n  $$('.palette-button').forEach(button => button.addEventListener('click', () => {\n    const colour = button.dataset.colour;\n    if (!stage || !['sage', 'clay', 'sand'].includes(colour)) return;\n    stage.dataset.palette = colour;\n    $$('[data-palette-name]').forEach(el => { el.textContent = colour; });\n    $$('.palette-button').forEach(el => el.setAttribute('aria-pressed', String(el === button)));\n  }));\n\n  // Copy the address, or provide an honest fallback if clipboard access is unavailable.\n  $$('[data-copy-email]').forEach(button => button.addEventListener('click', async () => {\n    const status = $('.copy-status', button.closest('.contact-method'));\n    try {\n      if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');\n      await navigator.clipboard.writeText(button.dataset.copyEmail);\n      status.textContent = 'Email address copied.';\n    } catch {\n      status.textContent = 'Please select and copy the email address above.';\n    }\n  }));\n\n  const gallery = $('[data-gallery]');\n  if (!gallery) return;\n  const categoryNames = { interior: 'Interior decorating', exterior: 'Exterior decorating', detail: 'Wallpaper & detail' };\n  const root = gallery.dataset.root || '';\n  const limit = Number(gallery.dataset.limit) || Infinity;\n  const source = Array.isArray(window.LETTS_GALLERY) ? window.LETTS_GALLERY : [];\n  // Restrict image paths to local files. The gallery never injects author-supplied HTML.\n  const validPath = path => typeof path === 'string' && /^assets\\/images\\/gallery\\/[a-z0-9][a-z0-9._/-]*\\.(?:webp|avif|jpe?g|png)$/i.test(path) && !path.includes('..');\n  const photos = source.filter(item => item && validPath(item.src) &&\n    typeof item.title === 'string' && item.title.trim() &&\n    typeof item.alt === 'string' && item.alt.trim() && categoryNames[item.category]);\n  const hasPhotos = photos.length > 0;\n  const status = $('[data-gallery-status]');\n  const count = $('[data-gallery-count]');\n  const notice = $('[data-empty-notice]');\n  const originalPlaceholders = [...gallery.children];\n  let activeCategory = 'all';\n  let visiblePhotos = [];\n  let currentIndex = 0;\n  let lastTrigger = null;\n  const modal = $('.lightbox');\n  const modalImage = $('.lightbox-image', modal);\n  const modalCaption = $('#lightbox-caption', modal);\n  const modalCount = $('.lightbox-count', modal);\n  const previous = $('.lightbox-prev', modal);\n  const next = $('.lightbox-next', modal);\n  const close = $('.lightbox-close', modal);\n  if (hasPhotos) {\n    if (notice) notice.hidden = true;\n    $$('[data-gallery-intro]').forEach(el => {\n      el.textContent = 'A selection of interiors, exteriors and finishing touches. Take a closer look at our work.';\n    });\n  }\n  function updateModal(index) {\n    if (!visiblePhotos.length) return;\n    currentIndex = (index + visiblePhotos.length) % visiblePhotos.length;\n    const item = visiblePhotos[currentIndex];\n    modalImage.src = root + item.src;\n    modalImage.alt = item.alt;\n    modalCaption.textContent = item.title;\n    modalCount.textContent = `${currentIndex + 1} / ${visiblePhotos.length}`;\n    previous.disabled = next.disabled = visiblePhotos.length \u003c 2;\n  }\n  function openPhoto(index, trigger) {\n    if (!modal?.showModal) {\n      // Older browsers still get access to the photograph, without relying on popups.\n      window.location.href = root + visiblePhotos[index].src;\n      return;\n    }\n    lastTrigger = trigger;\n    updateModal(index);\n    modal.showModal();\n    document.body.classList.add('modal-open');\n    close.focus();\n  }\n  close?.addEventListener('click', () => modal.close());\n  previous?.addEventListener('click', () => updateModal(currentIndex - 1));\n  next?.addEventListener('click', () => updateModal(currentIndex + 1));\n  modal?.addEventListener('close', () => {\n    document.body.classList.remove('modal-open');\n    modalImage.removeAttribute('src');\n    lastTrigger?.focus();\n  });\n  modal?.addEventListener('click', event => {\n    if (event.target !== modal) return;\n    const rect = modal.getBoundingClientRect();\n    if (event.clientX \u003c rect.left || event.clientX > rect.right || event.clientY \u003c rect.top || event.clientY > rect.bottom) modal.close();\n  });\n  modal?.addEventListener('keydown', event => {\n    if (event.key === 'ArrowLeft') { event.preventDefault(); updateModal(currentIndex - 1); }\n    if (event.key === 'ArrowRight') { event.preventDefault(); updateModal(currentIndex + 1); }\n  });\n  modalImage?.addEventListener('error', () => {\n    modalCaption.textContent = 'This photograph could not be loaded. Please try again later.';\n  });\n  const make = (tag, className, text) => {\n    const el = document.createElement(tag);\n    if (className) el.className = className;\n    if (text !== undefined) el.textContent = text;\n    return el;\n  };\n  function render() {\n    if (!hasPhotos) {\n      let shown = 0;\n      originalPlaceholders.forEach(card => {\n        card.hidden = activeCategory !== 'all' && card.dataset.category !== activeCategory;\n        if (!card.hidden) shown++;\n      });\n      if (status) status.textContent = `${shown} gallery categories shown. Project photographs are coming soon.`;\n      return;\n    }\n    visiblePhotos = photos.filter(item => activeCategory === 'all' || item.category === activeCategory).slice(0, limit);\n    gallery.replaceChildren();\n    visiblePhotos.forEach((item, index) => {\n      const article = make('article', 'project-card');\n      const button = make('button', 'project-open');\n      button.type = 'button';\n      button.setAttribute('aria-label', `View photograph: ${item.title}`);\n      const imageWrap = make('span', 'project-image-wrap');\n      const image = make('img', 'project-photo');\n      image.alt = item.alt;\n      image.loading = 'lazy';\n      image.decoding = 'async';\n      if (Number.isInteger(item.width) && item.width > 0) image.width = item.width;\n      if (Number.isInteger(item.height) && item.height > 0) image.height = item.height;\n      image.src = root + item.src;\n      image.addEventListener('error', () => {\n        image.hidden = true;\n        imageWrap.append(make('span', 'project-load-error', 'Photograph temporarily unavailable.'));\n        button.disabled = true;\n      }, { once: true });\n      const expand = make('span', 'photo-enlarge', '+');\n      expand.setAttribute('aria-hidden', 'true');\n      imageWrap.append(image, expand);\n      const meta = make('div', 'project-meta');\n      const text = make('div');\n      text.append(make('span', 'project-kicker', categoryNames[item.category].toUpperCase()), make('h3', '', item.title));\n      const number = make('span', 'project-number', String(index + 1).padStart(2, '0'));\n      number.setAttribute('aria-hidden', 'true');\n      meta.append(text, number);\n      button.append(imageWrap);\n      button.addEventListener('click', () => openPhoto(index, button));\n      article.append(button, meta);\n      gallery.append(article);\n    });\n    if (!visiblePhotos.length) gallery.append(make('p', 'gallery-no-results', 'No photographs in this category yet. Try another category or get in touch.'));\n    const label = `${visiblePhotos.length} photograph${visiblePhotos.length === 1 ? '' : 's'}`;\n    if (count) count.textContent = label;\n    if (status) status.textContent = `${label} shown.`;\n  }\n  $$('[data-filter]').forEach(button => button.addEventListener('click', () => {\n    activeCategory = button.dataset.filter;\n    $$('[data-filter]').forEach(el => el.setAttribute('aria-pressed', String(el === button)));\n    render();\n  }));\n  render();\n})();\n\u003c/script>\u003cscript>\ndocument.addEventListener('click', function(event) {\n const a=event.target.closest('a[href]');\n if(!a||a.target==='_blank')return;\n const raw=a.getAttribute('href');\n if(raw.startsWith('#')){\n  event.preventDefault();\n  const target=document.getElementById(raw.slice(1));\n  if(target){target.scrollIntoView();if(raw==='#main'){target.tabIndex=-1;target.focus({preventScroll:true});}}\n  return;\n }\n const url=new URL(raw,document.baseURI);\n if(url.origin!=='https://preview.lettsdecorate.invalid')return;\n event.preventDefault();\n const parts=url.pathname.replace(/\\/index\\.html$/,
